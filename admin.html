<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administrador Vanitys</title>

<style>

body{
    font-family:Arial;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    color:#c2185b;
}

textarea{
    width:100%;
    height:300px;
    padding:10px;
    font-family:monospace;
}

button{
    background:#c2185b;
    color:white;
    border:none;
    padding:15px 25px;
    cursor:pointer;
    font-size:18px;
}

#resultado{
    margin-top:20px;
    background:white;
    padding:15px;
    border-radius:10px;
}

</style>
</head>

<body>

<h1>Administrador Vanitys Boutique Coapa</h1>

<p>
Pega aquí el contenido de productos.json
</p>

<textarea id="json"></textarea>

<br><br>

<button onclick="generar()">
Validar JSON
</button>

<div id="resultado"></div>

<script>

function generar(){

try{

const datos =
JSON.parse(
document.getElementById('json').value
);

document.getElementById('resultado').innerHTML=
`
✅ JSON válido<br>
Productos encontrados: ${datos.length}
`;

}
catch(e){

document.getElementById('resultado').innerHTML=
`
❌ Error:<br>
${e.message}
`;

}

}

</script>

</body>
</html>
