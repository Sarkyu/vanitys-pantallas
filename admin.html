<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Administrador Vanitys</title>

<style>

body{
    font-family:Segoe UI,Arial;
    max-width:1200px;
    margin:auto;
    padding:20px;
    background:#f5f5f5;
}

h1{
    color:#c2185b;
}

.panel{
    background:white;
    padding:20px;
    border-radius:10px;
    margin-bottom:20px;
}

input{
    width:100%;
    padding:12px;
    margin-top:5px;
    margin-bottom:15px;
}

button{
    background:#c2185b;
    color:white;
    border:none;
    padding:12px 20px;
    cursor:pointer;
    border-radius:6px;
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
}

th,td{
    padding:12px;
    border:1px solid #ddd;
}

textarea{
    width:100%;
    height:250px;
    margin-top:20px;
    font-family:monospace;
}

</style>
</head>
<body>

<h1>Administrador Vanitys Boutique Coapa</h1>

<div class="panel">

<label>Nombre</label>
<input id="nombre">

<label>Precio</label>
<input id="precio">

<label>Imagen</label>
<input
id="imagen"
placeholder="va.jpeg"
oninput="preview()">

<br><br>

<img
id="preview"
style="
max-width:250px;
border-radius:10px;
display:none;
">

<button onclick="agregar()">
Agregar Producto
</button>

</div>

<table>

<thead>
<tr>
<th>Producto</th>
<th>Precio</th>
<th>Imagen</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

<br>

<button onclick="exportar()">
Generar JSON
</button>

<textarea id="resultado"></textarea>

<script>

let productos=[];

function preview(){

const archivo =
document.getElementById('imagen').value;

const img =
document.getElementById('preview');

img.src = archivo;
img.style.display="block";

}
    
function agregar(){

const producto = {

nombre:
document.getElementById('nombre').value,

precio:
document.getElementById('precio').value,

imagen:
document.getElementById('imagen').value

};

productos.push(producto);

render();

document.getElementById('nombre').value='';
document.getElementById('precio').value='';
document.getElementById('imagen').value='';

}

function render(){

const tabla =
document.getElementById('tabla');

tabla.innerHTML='';

productos.forEach(p=>{

tabla.innerHTML += `
<tr>
<td>${p.nombre}</td>
<td>${p.precio}</td>
<td>${p.imagen}</td>
</tr>
`;

});

}

function exportar(){

document.getElementById('resultado').value =
JSON.stringify(productos,null,2);

}

</script>

</body>
</html>
