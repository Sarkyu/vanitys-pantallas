<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administrador Vanitys Boutique Coapa</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f5f5f5;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    color:#c2185b;
    margin-bottom:20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:15px;
}

button{
    background:#c2185b;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    margin-right:10px;
}

button:hover{
    background:#a9154f;
}

.preview{
    margin-top:15px;
}

.preview img{
    max-width:250px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
}
