<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Administrador Vanitys Boutique Coapa</title>

<style>

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:#f5f5f5;
    max-width:1200px;
    margin:auto;
    padding:20px;
}

h1{
    color:#c2185b;
    margin-bottom:20px;
}

.panel{
    background:white;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-top:10px;
    margin-bottom:5px;
    font-weight:600;
}

input,
select{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:6px;
    margin-bottom:15px;
}

button{
    background:#c2185b;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:6px;
    cursor:pointer;
    margin-right:10px;
}

button:hover{
    background:#a9154f;
}

.preview{
    margin-top:15px;
}

.preview img{
    max-width:250px;
    border-radius:10px;
    box-shadow:0 2px 10px rgba(0,0,0,.15);
}

table{
    width:100%;
    border-collapse:collapse;
    background:white;
    border-radius:12px;
    overflow:hidden;
}

th{
    background:#c2185b;
    color:white;
}

td,th{
    padding:12px;
    border:1px solid #eee;
    text-align:left;
}

textarea{
    width:100%;
    height:300px;
    margin-top:15px;
    font-family:Consolas,monospace;
    padding:15px;
    border-radius:10px;
    border:1px solid #ddd;
}

.small-btn{
    background:#e53935;
    padding:8px 12px;
}

.small-btn:hover{
    background:#c62828;
}

</style>
</head>
<body>

<h1>Administrador Vanitys Boutique Coapa</h1>

<div class="panel">

<label>Nombre del Producto</label>
<input id="nombre" placeholder="Vanity Premium">

<label>Precio</label>
<input id="precio" placeholder="$3,499">

<label>Imagen</label>

<select id="imagen" onchange="preview()">

<option value="va.jpeg">
Vanity Premium
</option>

<option value="va80.jpeg">
Vanity 80 cm
</option>

<option value="va80abierto.jpeg">
Vanity Organizador
</option>

<option value="va80frente.jpeg">
Vanity Frente LED
</option>

</select>

<div class="preview">
<img id="preview" src="va.jpeg">
</div>

<br>

<button onclick="agregar()">
➕ Agregar Producto
</button>

</div>

<table>

<thead>
<tr>
    <th>Producto</th>
    <th>Precio</th>
    <th>Imagen</th>
    <th>Acciones</th>
</tr>
</thead>

<tbody id="tabla"></tbody>

</table>

<br>

<button onclick="exportar()">
📄 Generar JSON
</button>

<button onclick="copiarJSON()">
📋 Copiar JSON
</button>

<textarea id="resultado"></textarea>

<script>

let productos = [];

function preview(){

const archivo =
document.getElementById('imagen').value;

document.getElementById('preview').src =
archivo;

}

function agregar(){

const nombre =
document.getElementById('nombre').value.trim();

const precio =
document.getElementById('precio').value.trim();

const imagen =
document.getElementById('imagen').value;

if(!nombre || !precio){

alert('Completa nombre y precio');

return;
}

productos.push({

nombre:nombre,
precio:precio,
imagen:imagen

});

render();

document.getElementById('nombre').value='';
document.getElementById('precio').value='';

}

function eliminar(index){

productos.splice(index,1);

render();

}

function render(){

const tabla =
document.getElementById('tabla');

tabla.innerHTML='';

productos.forEach((p,index)=>{

tabla.innerHTML += `

<tr>

<td>${p.nombre}</td>

<td>${p.precio}</td>

<td>${p.imagen}</td>

<td>
<button
class="small-btn"
onclick="eliminar(${index})">
🗑 Eliminar
</button>
</td>

</tr>

`;

});

}

function exportar(){

const json =
JSON.stringify(
productos,
null,
2
);

document.getElementById('resultado').value =
json;

}

function copiarJSON(){

const textarea =
document.getElementById('resultado');

textarea.select();

document.execCommand('copy');

alert('JSON copiado al portapapeles');

}

preview();

</script>

</body>
</html>
