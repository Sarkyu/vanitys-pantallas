<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Vanitys Boutique Coapa</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#f7d7e4;
overflow:hidden;
}

header{
height:100px;
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:20px 40px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.logo{
font-size:42px;
font-weight:900;
color:#c2185b;
}

.sub{
font-size:18px;
color:#777;
}

.qr{
text-align:center;
}

.qr img{
width:90px;
}

.qr small{
display:block;
}

.categoria{
height:60px;
display:flex;
align-items:center;
justify-content:center;
font-size:34px;
font-weight:900;
color:#c2185b;
}

#productos{
padding:20px;
display:grid;
grid-template-columns:1fr 1fr;
grid-template-rows:1fr 1fr;
gap:20px;
height:calc(100vh - 220px);
}

.card{
background:white;
border-radius:20px;
overflow:hidden;
display:flex;
box-shadow:0 5px 20px rgba(0,0,0,.12);
}

.card img{
width:55%;
object-fit:contain;
background:white;
}

.info{
flex:1;
padding:20px;
display:flex;
flex-direction:column;
justify-content:center;
}

.nombre{
font-size:28px;
font-weight:800;
color:#333;
}

.precio{
margin-top:15px;
font-size:52px;
font-weight:900;
color:#e53935;
}

.colores{
margin-top:12px;
font-size:18px;
color:#666;
}

.stock{
margin-top:15px;
font-size:24px;
font-weight:bold;
}

.verde{
color:#2e7d32;
}

.amarillo{
color:#ef6c00;
}

.rojo{
color:#c62828;
}

footer{
height:60px;
background:#c2185b;
color:white;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:700;
}

</style>
</head>

<body>

<header>

<div>
<div class="logo">
Vanitys Boutique Coapa
</div>

<div class="sub">
Catálogo Digital
</div>
</div>

<div class="qr">

<img
src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/525581582869">

<small>WhatsApp</small>

</div>

</header>

<div id="tituloCategoria" class="categoria">
Cargando...
</div>

<div id="productos"></div>

<footer>
Cotiza por WhatsApp • Entregas CDMX y Área Metropolitana • Cobertura sujeta a ubicación
</footer>

<script>

const catalogoCSV =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vQR5osDmFVFiv5UoIcoUZwPa9kveX_VBQRGKaVq0EAbgAkMN4E8zFiqGWCB15kJt9cYZ3U9baZoRJsG/pub?gid=1715278299&single=true&output=csv';

const inventarioCSV =
'https://docs.google.com/spreadsheets/d/e/2PACX-1vQR5osDmFVFiv5UoIcoUZwPa9kveX_VBQRGKaVq0EAbgAkMN4E8zFiqGWCB15kJt9cYZ3U9baZoRJsG/pub?gid=2081535030&single=true&output=csv';

const IMG_BASE =
'https://sarkyu.github.io/vanitys-pantallas/img/';

let pantallas = [];
let actual = 0;

function csvToArray(text){

const rows = text.trim().split("\n");

const headers =
rows[0]
.split(",")
.map(h=>h.trim());

return rows.slice(1).map(row=>{

const values = row.split(",");

let obj = {};

headers.forEach((h,i)=>{
obj[h.trim()] =
(values[i] || '').trim();
});

return obj;

});

}

function disponibilidad(stock,minimo){

stock = Number(stock);
minimo = Number(minimo);

if(stock <= 0){

return {
texto:'🔴 Bajo pedido',
clase:'rojo'
};

}

if(stock <= minimo){

return {
texto:'🟡 Últimas piezas',
clase:'amarillo'
};

}

return {
texto:'🟢 Disponible',
clase:'verde'
};

}

Promise.all([
fetch(catalogoCSV).then(r=>r.text()),
fetch(inventarioCSV).then(r=>r.text())
])

.then(([catalogoTxt,inventarioTxt])=>{

const catalogo =
csvToArray(catalogoTxt);

const inventario =
csvToArray(inventarioTxt);

const productos = [];

catalogo.forEach(item=>{

if(
(item.Mostrar_TV || '').toUpperCase() !== 'SI'
){
return;
}

const inv = inventario.filter(i=>
i.Producto === item.Producto
);

const stockTotal =
inv.reduce(
(a,b)=>
a+Number(b.Stock_Actual||0),
0
);

const colores =
[
...new Set(
inv.map(x=>x.Color)
)
];

productos.push({

nombre:item.Producto,

categoria:item.Categoria,

precio:item.Precio_Unitario,

imagen:
IMG_BASE + item.Imagen,

orden:Number(item.Orden_TV),

destacado:
(item.Destacado || '')
.toUpperCase() === 'SI',

colores,

stock:
disponibilidad(
stockTotal,
item.Stock_Minimo
)

});

});

productos.sort(
(a,b)=>a.orden-b.orden
);

const categorias =
[...new Set(
productos.map(p=>p.categoria)
)];

const destacados =
productos.filter(
p=>p.destacado
);

if(destacados.length){

pantallas.push({
nombre:'⭐ DESTACADOS',
items:destacados
});

}

categorias.forEach(cat=>{

pantallas.push({

nombre:cat.toUpperCase(),

items:productos.filter(
p=>p.categoria===cat
)

});

});

render();

setInterval(()=>{

actual++;

if(actual>=pantallas.length){
actual=0;
}

render();

},15000);

});

function render(){

const pantalla =
pantallas[actual];

document.getElementById(
'tituloCategoria'
).innerText =
pantalla.nombre;

const productos =
pantalla.items.slice(0,4);

document.getElementById(
'productos'
).innerHTML =
productos.map(p=>`

<div class="card">

<img src="${p.imagen}">

<div class="info">

<div class="nombre">
${p.nombre}
</div>

<div class="precio">
${p.precio}
</div>

<div class="colores">
${p.colores.join(' • ')}
</div>

<div class="stock ${p.stock.clase}">
${p.stock.texto}
</div>

</div>

</div>

`).join('');

}

</script>

</body>
</html>
