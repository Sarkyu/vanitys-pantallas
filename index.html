<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Darvina Home</title>
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,Arial,sans-serif;}
body{background:#f5d9e5;overflow-x:hidden;}
header{min-height:110px;background:white;display:flex;justify-content:space-between;align-items:center;padding:10px 30px;}
.logo{font-size:42px;font-weight:900;color:#c2185b;}
#estado{font-size:13px;color:#777;margin-top:2px;}
#estado.offline{color:#c62828;font-weight:700;}
.top-controls{display:flex;align-items:center;gap:10px;}
select,button{padding:10px 15px;border:none;border-radius:8px;cursor:pointer;font-size:15px;}
button{background:#c2185b;color:white;}
select{background:#f4f4f4;}
.qr img{width:75px;}
.categoria{height:45px;display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:900;color:#c2185b;}
#productos{padding:12px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:12px;height:calc(100vh - 200px);}
.card{background:white;display:flex;border-radius:18px;overflow:hidden;box-shadow:0 3px 15px rgba(0,0,0,.12);}
.card img{width:65%;object-fit:contain;background:white;}
.info{padding:20px;display:flex;flex-direction:column;justify-content:flex-start;gap:12px;}
.nombre{font-size:30px;font-weight:800;color:#111;margin-top:10px;}
.precio{font-size:54px;font-weight:900;color:#e53935;}
.colores{line-height:1.4;}
.color-badge{display:inline-block;margin-right:6px;margin-bottom:4px;padding:4px 8px;background:#f3f3f3;border-radius:12px;font-size:14px;color:#666;}
.leyenda-global{display:flex;align-items:center;gap:10px;font-size:11px;color:#666;white-space:nowrap;}
.vacio{grid-column:1/-1;display:flex;align-items:center;justify-content:center;font-size:24px;color:#999;}
footer{height:45px;background:#c2185b;color:white;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;}
@media (max-width:1024px){
#productos{grid-template-columns:1fr;grid-template-rows:auto;height:auto;}
.card{min-height:320px;}
}
@media (max-width:768px){
body{overflow-y:auto;}
header{flex-direction:column;align-items:flex-start;gap:10px;height:auto;}
.top-controls{width:100%;flex-wrap:wrap;}
.qr{display:none;}
.card{flex-direction:column;}
.card img{width:100%;height:320px;}
footer{position:relative;}
}
</style>
</head>
<body>

<header>
  <div>
    <div class="logo">Darvina Home</div>
    <div>Catálogo Digital</div>
    <div id="estado"></div>
  </div>

  <div class="top-controls">
    <select id="selectorCategoria"></select>
    <div class="leyenda-global">🟢 Disponible &nbsp; 🟡 Últimas &nbsp; 🔴 Pedido</div>
    <button onclick="ir(-1)">◀</button>
    <button onclick="togglePausa()" id="btnPausa">⏸</button>
    <button onclick="ir(1)">▶</button>
  </div>

  <div class="qr">
    <img alt="WhatsApp" src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/525581582869" onerror="this.style.display='none'">
  </div>
</header>

<div class="categoria" id="titulo">Cargando catálogo...</div>
<div id="productos"></div>

<footer>Cotiza por WhatsApp • Entregas CDMX y Área Metropolitana • Cobertura sujeta a ubicación</footer>

<script>
const CSV_CATALOGO = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQR5osDmFVFiv5UoIcoUZwPa9kveX_VBQRGKaVq0EAbgAkMN4E8zFiqGWCB15kJt9cYZ3U9baZoRJsG/pub?gid=1715278299&single=true&output=csv";
const CSV_INVENTARIO = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQR5osDmFVFiv5UoIcoUZwPa9kveX_VBQRGKaVq0EAbgAkMN4E8zFiqGWCB15kJt9cYZ3U9baZoRJsG/pub?gid=2081535030&single=true&output=csv";
const BASE_IMG = "https://sarkyu.github.io/vanitys-pantallas/img/";

const POR_PAGINA = 4;
const ROTAR_MS = 15000;
const REFRESCAR_MS = 300000;   // 5 min
const REINTENTO_MS = 30000;    // 30 s si falla
const CACHE_KEY = 'vanitys_cache_v1';

const PH = 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="100%" height="100%" fill="#f3f3f3"/><text x="50%" y="50%" fill="#bbb" font-size="24" text-anchor="middle" font-family="Arial">Sin imagen</text></svg>'
);

let paginas = [];
let idx = 0;
let pausado = false;
let timer = null;
let ultimaOk = null;

const $ = id => document.getElementById(id);

const esc = t => String(t == null ? '' : t)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// compara sin importar mayúsculas, acentos ni espacios extra
const norm = s => String(s || '').trim().toLowerCase()
  .normalize('NFD').replace(/[\u0300-\u036f]/g,'');

function fmtPrecio(p){
  const n = Number(String(p || '').replace(/[^0-9.]/g,''));
  if(!isFinite(n) || n <= 0){ return esc(p || ''); }
  return n.toLocaleString('es-MX',{style:'currency',currency:'MXN',maximumFractionDigits:0});
}

function cargarCSV(url){
  return new Promise((resolve, reject) => {
    Papa.parse(url + '&t=' + Date.now(), {
      download: true,
      header: true,
      skipEmptyLines: true,
      complete: r => resolve(r.data),
      error: e => reject(e)
    });
  });
}

// ===== Construcción de datos =====

function construir(catalogo, inventario){

  const inv = new Map();

  inventario.forEach(r => {
    const k = norm(r.Producto);
    if(!k){ return; }
    if(!inv.has(k)){ inv.set(k, []); }
    inv.get(k).push(r);
  });

  const productos = [];

  catalogo.forEach(item => {

    if((item.Mostrar_TV || '').trim().toUpperCase() !== 'SI'){ return; }

    const nombre = (item.Producto || '').trim();
    if(!nombre){ return; }

    const minimo = Number(item.Stock_Minimo) || 0;

    // agrupa por color y suma todas las ubicaciones
    const porColor = new Map();

    (inv.get(norm(nombre)) || []).forEach(r => {
      const label = (r.Color || '').trim();
      const k = norm(label) || 'sin color';
      const c = porColor.get(k) || { color: label || 'Sin color', cantidad: 0 };
      c.cantidad += Number(r.Stock_Actual) || 0;
      porColor.set(k, c);
    });

    let colores = [...porColor.values()].map(c => ({
      color: c.color,
      icono: c.cantidad <= 0 ? '🔴' : (c.cantidad <= minimo ? '🟡' : '🟢')
    }));

    // respaldo: si no hay inventario, usa "Colores TV" del catálogo
    if(!colores.length && item.Colores_TV){
      colores = String(item.Colores_TV).split(',')
        .map(s => s.trim()).filter(Boolean)
        .map(c => ({ color: c, icono: '🔴' }));
    }

    productos.push({
      nombre: nombre,
      categoria: (item.Categoria || '').trim() || 'Otros',
      precio: fmtPrecio(item.Precio_Unitario),
      imagen: (item.Imagen || '').trim(),
      orden: Number(item.Orden_TV) || 9999,   // sin orden → al final
      destacado: (item.Destacado || '').trim().toUpperCase() === 'SI',
      colores: colores
    });

  });

  productos.sort((a,b) => a.orden - b.orden || a.nombre.localeCompare(b.nombre));

  const grupos = [];
  const dest = productos.filter(p => p.destacado);

  if(dest.length){
    grupos.push({ key:'__DEST__', nombre:'⭐ DESTACADOS', items:dest });
  }

  [...new Set(productos.map(p => p.categoria))].forEach(cat => {
    grupos.push({ key:cat, nombre:cat, items:productos.filter(p => p.categoria === cat) });
  });

  // cada grupo se parte en páginas de 4
  const pags = [];

  grupos.forEach(g => {
    const total = Math.ceil(g.items.length / POR_PAGINA);
    for(let i = 0; i < total; i++){
      pags.push({
        key: g.key,
        nombre: g.nombre,
        pag: i + 1,
        total: total,
        items: g.items.slice(i * POR_PAGINA, (i + 1) * POR_PAGINA)
      });
    }
  });

  return pags;

}

function aplicar(catalogo, inventario){

  const actual = paginas[idx];

  paginas = construir(catalogo, inventario);

  // conserva la posición actual tras refrescar
  idx = 0;
  if(actual){
    const i = paginas.findIndex(p => p.key === actual.key && p.pag === actual.pag);
    if(i >= 0){ idx = i; }
  }

  // selector
  const sel = $('selectorCategoria');
  sel.innerHTML = '';
  const vistos = new Set();

  paginas.forEach(p => {
    if(vistos.has(p.key)){ return; }
    vistos.add(p.key);
    const o = document.createElement('option');
    o.value = p.key;
    o.textContent = p.nombre;
    sel.appendChild(o);
  });

  render();
  reiniciarTimer();

}

// ===== Render =====

function render(){

  const p = paginas[idx];

  if(!p){
    $('titulo').textContent = 'Sin productos para mostrar';
    $('productos').innerHTML = '';
    return;
  }

  $('titulo').textContent = p.nombre + (p.total > 1 ? ` (${p.pag}/${p.total})` : '');
  $('selectorCategoria').value = p.key;

  $('productos').innerHTML = p.items.map(x => {

    const src = x.imagen ? BASE_IMG + encodeURIComponent(x.imagen) : PH;

    return `
      <div class="card">
        <img src="${src}" alt="${esc(x.nombre)}" onerror="this.onerror=null;this.src=PH">
        <div class="info">
          <div class="nombre">${esc(x.nombre)}</div>
          <div class="precio">${x.precio}</div>
          <div class="colores">
            ${x.colores.map(c => `<span class="color-badge">${c.icono} ${esc(c.color)}</span>`).join('')}
          </div>
        </div>
      </div>`;

  }).join('');

}

// ===== Navegación =====

function ir(d){
  if(!paginas.length){ return; }
  idx = (idx + d + paginas.length) % paginas.length;
  render();
  reiniciarTimer();
}

function reiniciarTimer(){
  clearInterval(timer);
  timer = setInterval(() => {
    if(!pausado && paginas.length){
      idx = (idx + 1) % paginas.length;
      render();
    }
  }, ROTAR_MS);
}

function togglePausa(){
  pausado = !pausado;
  $('btnPausa').innerText = pausado ? '▶' : '⏸';
}

$('selectorCategoria').addEventListener('change', e => {
  const i = paginas.findIndex(p => p.key === e.target.value);
  if(i >= 0){ idx = i; render(); reiniciarTimer(); }
});

// ===== Datos: carga, caché y actualización sin recargar =====

function setEstado(txt, offline){
  const el = $('estado');
  el.textContent = txt;
  el.className = offline ? 'offline' : '';
}

function guardarCache(cat, inv){
  try{
    localStorage.setItem(CACHE_KEY, JSON.stringify({ cat:cat, inv:inv, ts:Date.now() }));
  }catch(e){}
}

function leerCache(){
  try{
    return JSON.parse(localStorage.getItem(CACHE_KEY));
  }catch(e){
    return null;
  }
}

async function actualizar(){

  try{

    const [cat, inv] = await Promise.all([
      cargarCSV(CSV_CATALOGO),
      cargarCSV(CSV_INVENTARIO)
    ]);

    if(!cat.length || !('Producto' in cat[0])){
      throw new Error('El CSV del catálogo no tiene el formato esperado');
    }

    guardarCache(cat, inv);
    aplicar(cat, inv);

    ultimaOk = new Date();
    setEstado('Datos al ' + ultimaOk.toLocaleString('es-MX'), false);

    return true;

  }catch(e){

    console.error(e);

    if(!paginas.length){

      const c = leerCache();

      if(c){
        aplicar(c.cat, c.inv);
        setEstado('Sin conexión · datos guardados del ' + new Date(c.ts).toLocaleString('es-MX'), true);
      }else{
        $('titulo').textContent = 'No se pudo cargar el catálogo. Reintentando...';
      }

    }else{
      setEstado('Sin conexión · mostrando datos del ' + (ultimaOk ? ultimaOk.toLocaleString('es-MX') : 'último guardado'), true);
    }

    return false;

  }

}

async function ciclo(){
  const ok = await actualizar();
  setTimeout(ciclo, ok ? REFRESCAR_MS : REINTENTO_MS);
}

ciclo();
</script>

</body>
</html>
