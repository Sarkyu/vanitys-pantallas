<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanitys Boutique Coapa</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,sans-serif;
}

body{
    background:#f7d9e5;
    height:100vh;
    overflow:hidden;
}

.header{
    height:110px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
    box-shadow:0 3px 10px rgba(0,0,0,.15);
}

.logo{
    font-size:42px;
    font-weight:900;
    color:#c2185b;
}

.qr{
    text-align:center;
}

.qr img{
    width:90px;
}

.qr span{
    display:block;
    font-size:14px;
}

.productos{
    height:calc(100vh - 170px);
    padding:20px;
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:20px;
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0px 4px 15px rgba(0,0,0,.15);
    display:flex;
}

.card img{
    width:50%;
    object-fit:cover;
}

.info{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    padding:20px;
}

.nombre{
    font-size:26px;
    font-weight:700;
    color:#444;
}

.precio{
    margin-top:15px;
    color:#e53935;
    font-size:44px;
    font-weight:900;
}

.footer{
    height:60px;
    background:#c2185b;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:24px;
    font-weight:bold;
}

</style>
</head>
<body>

<div class="header">

    <div class="logo">
        Vanitys Boutique Coapa
    </div>

    <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=120x120&data=https://wa.me/525500000000">
        <span>Catálogo</span>
    </div>

</div>

<div class="productos">

    <div class="card">
        <img src="va.jpeg">
        <div class="info">
            <div class="nombre">
                Tocador Vanity Premium
            </div>
            <div class="precio">
                $3,499
            </div>
        </div>
    </div>

    <div class="card">
        <img src="va80.jpeg">
        <div class="info">
            <div class="nombre">
                Vanity 80 cm
            </div>
            <div class="precio">
                $4,299
            </div>
        </div>
    </div>

    <div class="card">
        <img src="va80abierto.jpeg">
        <div class="info">
            <div class="nombre">
                Vanity Organizador
            </div>
            <div class="precio">
                $4,599
            </div>
        </div>
    </div>

    <div class="card">
        <img src="va80frente.jpeg">
        <div class="info">
            <div class="nombre">
                Vanity Frente LED
            </div>
            <div class="precio">
                $4,999
            </div>
        </div>
    </div>

</div>

<div class="footer">
    Promociones Exclusivas • Vanitys Boutique Coapa
</div>

</body>
</html>
