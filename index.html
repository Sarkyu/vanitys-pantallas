<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Vanitys Boutique Coapa</title>

<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Segoe UI,Arial,sans-serif;
}

body{
background:#f5d9e5;
overflow:hidden;
}

header{
height:110px;
background:white;
display:flex;
justify-content:space-between;
align-items:center;
padding:15px 30px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.logo{
font-size:42px;
font-weight:900;
color:#c2185b;
}

.top-controls{
display:flex;
align-items:center;
gap:10px;
}

select,
button{
padding:10px 15px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:15px;
}

button{
background:#c2185b;
color:white;
}

select{
background:#f4f4f4;
}

.qr img{
width:75px;
}

.categoria{
    height:45px;
}

#productos{
    padding:10px;
    gap:10px;
}

.card{
    display:grid;
    grid-template-columns:55% 45%;
}


.card img{
    width:100%;
    height:100%;
    object-fit:contain;
}

.info{
    padding:15px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap:10px;
}

.nombre{
font-size:28px;
font-weight:800;
}

.precio{
margin-top:10px;
font-size:54px;
font-weight:900;
color:#e53935;
}

.colores{
margin-top:10px;
color:#666;
font-size:18px;
}

.stock{
margin-top:12px;
font-size:24px;
font-weight:bold;
}

.verde{
color:#2e7d32;
}

.amarillo{
color:#ef6c00;
}

.rojo{
color:#c62828;
}

footer{
height:60px;
background:#c2185b;
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:20px;
font-weight:700;
}

</style>
</head>

<body>

<header>

<div>

<div class="logo">
Vanitys Boutique Coapa
</div>

<div>
Catálogo Digital
</div>

<div id="ultimaActualizacion"></div>

</div>

<div class="top-controls">

<select id="selectorCategoria">
<option value="TODOS">Todos</option>
</select>

<button onclick="anterior()">◀</button>

<button onclick="togglePausa()" id="btnPausa">
⏸
</button>

<button onclick="siguiente()">▶</button>

</div>

<div class="qr">

<img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/525581582869">

</div>

</header>

<div class="categoria" id="titulo">
Cargando catálogo...
</div>

<div id="productos"></div>

<footer>

Cotiza por WhatsApp • Entregas CDMX y Área Metropolitana • Cobertura sujeta a ubicación

</footer>

<script>

const CSV_CATALOGO =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQR5osDmFVFiv5UoIcoUZwPa9kveX_VBQRGKaVq0EAbgAkMN4E8zFiqGWCB15kJt9cYZ3U9baZoRJsG/pub?gid=1715278299&single=true&output=csv";

const CSV_INVENTARIO =
"https://docs.google.com/spreadsheets/d/e/2PACX-1vQR5osDmFVFiv5UoIcoUZwPa9kveX_VBQRGKaVq0EAbgAkMN4E8zFiqGWCB15kJt9cYZ3U9baZoRJsG/pub?gid=2081535030&single=true&output=csv";

const BASE_IMG =
"https://sarkyu.github.io/vanitys-pantallas/img/";

let categorias = [];
let categoriaIndex = 0;
let pausado = false;
let timer;

function cargarCSV(url){

return new Promise((resolve,reject)=>{

Papa.parse(url,{

download:true,
header:true,
skipEmptyLines:true,

complete:(r)=>resolve(r.data),

error:(e)=>reject(e)

});

});

}

function estadoStock(stock,minimo){

stock = Number(stock);
minimo = Number(minimo);

if(stock <= 0){

return {
texto:"🔴 Bajo pedido",
clase:"rojo"
};

}

if(stock <= minimo){

return {
texto:"🟡 Últimas piezas",
clase:"amarillo"
};

}

return {
texto:"🟢 Disponible",
clase:"verde"
};

}

Promise.all([
cargarCSV(CSV_CATALOGO),
cargarCSV(CSV_INVENTARIO)
])

.then(([catalogo,inventario])=>{

const productos=[];

catalogo.forEach(item=>{

if(
(item.Mostrar_TV || '').trim().toUpperCase() !== 'SI'
){
return;
}

const productoNombre =
(item.Producto || '').trim();

const stockRows =
inventario.filter(i =>
(i.Producto || '').trim() === productoNombre
);

const stockTotal =
stockRows.reduce(
(a,b)=>a+Number(b.Stock_Actual||0),
0
);

const colores =
[
...new Set(
stockRows.map(x =>
(x.Color || '').trim()
)
)
];

productos.push({

nombre:productoNombre,

categoria:
(item.Categoria || '').trim(),

precio:
(item.Precio_Unitario || '').trim(),

imagen:
BASE_IMG +
(item.Imagen || '').trim(),

orden:
Number(item.Orden_TV || 0),

destacado:
(item.Destacado || '')
.trim()
.toUpperCase() === 'SI',

colores,

stock:
estadoStock(
stockTotal,
item.Stock_Minimo
)

});

});

productos.sort(
(a,b)=>a.orden-b.orden
);

const selector =
document.getElementById(
'selectorCategoria'
);

const destacados =
productos.filter(
x=>x.destacado
);

categorias.push({
nombre:'⭐ DESTACADOS',
items:destacados
});

const cats =
[
...new Set(
productos.map(
p=>p.categoria
)
)
];

cats.forEach(cat=>{

categorias.push({

nombre:cat,

items:
productos.filter(
p=>p.categoria===cat
)

});

const option =
document.createElement('option');

option.value = cat;
option.textContent = cat;

selector.appendChild(option);

});

selector.addEventListener(
'change',
e=>{

const valor =
e.target.value;

if(valor==="TODOS"){

categoriaIndex = 0;

}else{

categoriaIndex =
categorias.findIndex(
c=>c.nombre===valor
);

}

render();

}
);

render();

timer=setInterval(()=>{

if(!pausado){

categoriaIndex++;

if(
categoriaIndex >= categorias.length
){

categoriaIndex = 0;

}

render();

}

},15000);

});

function render(){

const actual =
categorias[categoriaIndex];

if(!actual){return;}

document
.getElementById('titulo')
.innerText =
actual.nombre;

const items =
actual.items.slice(0,4);

document
.getElementById('productos')
.innerHTML =

items.map(p=>`

<div class="card">

<img src="${p.imagen}">

<div class="info">

<div class="nombre">
${p.nombre}
</div>

<div class="precio">
${p.precio}
</div>

<div class="colores">
${p.colores.join(' • ')}
</div>

<div class="stock ${p.stock.clase}">
${p.stock.texto}
</div>

</div>

</div>

`).join('');

}

function siguiente(){

categoriaIndex++;

if(categoriaIndex>=categorias.length){

categoriaIndex=0;

}

render();

}

function anterior(){

categoriaIndex--;

if(categoriaIndex<0){

categoriaIndex=
categorias.length-1;

}

render();

}

function togglePausa(){

pausado=!pausado;

document
.getElementById('btnPausa')
.innerText =

pausado ? '▶' : '⏸';

}

document.getElementById(
 'ultimaActualizacion'
).textContent =
'Actualizado: ' +
new Date().toLocaleString('es-MX');

</script>

</body>
</html>
