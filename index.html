<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Vanitys Boutique Coapa</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Segoe UI,Arial,sans-serif;
}

body{
    background:#f5d9e5;
    overflow:hidden;
}

.header{
    height:120px;
    background:white;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 40px;
}

.logo{
    font-size:48px;
    color:#c2185b;
    font-weight:900;
}

.qr img{
    width:90px;
}

.productos{
    display:grid;
    grid-template-columns:1fr 1fr;
    grid-template-rows:1fr 1fr;
    gap:20px;
    padding:20px;
    height:calc(100vh - 180px);
}

.card{
    background:white;
    border-radius:18px;
    overflow:hidden;
    display:flex;
    box-shadow:0 3px 12px rgba(0,0,0,.12);
}

.card img{
    width:60%;
    object-fit:cover;
}

.info{
    padding:20px;
    display:flex;
    flex-direction:column;
    justify-content:center;
}

.nombre{
    font-size:24px;
    font-weight:700;
    color:#333;
}

.precio{
    margin-top:15px;
    font-size:48px;
    color:#e53935;
    font-weight:900;
}

.footer{
    height:60px;
    background:#c2185b;
    display:flex;
    align-items:center;
    justify-content:center;
    color:white;
    font-size:26px;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="header">
    <div class="logo">
        Vanitys Boutique Coapa
    </div>

    <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://wa.me/525500000000">
    </div>
</div>

<div id="productos" class="productos"></div>

<div class="footer">
    Promociones Exclusivas • Vanitys Boutique Coapa
</div>

<script>

fetch('productos.json')
.then(r => r.json())
.then(productos => {

const contenedor =
document.getElementById('productos');

contenedor.innerHTML = '';

productos.forEach(producto => {

contenedor.innerHTML += `
<div class="card">

<img src="${producto.imagen}">

<div class="info">

<div class="nombre">
${producto.nombre}
</div>

<div class="precio">
${producto.precio}
</div>

</div>

</div>
`;

});

});

</script>

</body>
</html>
